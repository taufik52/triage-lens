modules:
  jira:issuePanel:
    - key: triage-lens-panel
      function: main
      # UI Kit 2 REQUIRES `render: native` — without it Forge treats the
      # module as deprecated UI Kit 1 and the @forge/react bundle never
      # renders (panel stuck on skeleton, backend never invoked).
      render: native
      title: Triage Lens
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: main
      handler: index.run
app:
  id: ari:cloud:ecosystem::app/1740e52b-89b0-4be6-b938-bd3e0450e9ef
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    # Read issue fields + JQL search (duplicate candidates)
    - read:jira-work
    # Apply the suggested priority back to the issue (user confirms in UI)
    - write:jira-work
